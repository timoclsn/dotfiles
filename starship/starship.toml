"$schema" = 'https://starship.rs/config-schema.json'

# Tool version lookups go through mise shims, which can take longer than the
# default 500ms on a cold cache
command_timeout = 1000

[gcloud]
disabled = true

[status]
disabled = false

[package]
disabled = true

[docker_context]
disabled = true

[deno]
disabled = true

[git_branch]
truncation_length = 30
